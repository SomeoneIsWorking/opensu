name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    name: Signed AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
          enable-cache: false
      - name: Install the X server the render check draws to
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth
      - name: Build, sign and smoke-test the AppImage
        env:
          OPENSU_APPIMAGE_SIGNING_KEY: ${{ secrets.OPENSU_APPIMAGE_SIGNING_KEY }}
        run: |
          test -n "$OPENSU_APPIMAGE_SIGNING_KEY" || { echo "OPENSU_APPIMAGE_SIGNING_KEY is not set"; exit 1; }
          xvfb-run -a uv run --frozen python -m tools.appimage all --version "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: build/appimage/out/
          retention-days: 7
          if-no-files-found: error

  android:
    name: Signed Android APK (arm64-v8a, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
          enable-cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >-
            platforms;android-35
            build-tools;35.0.0
            ndk;28.2.13676358
      - name: Ninja for the native builds
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      # The android-port prefix only changes with its pin; a miss rebuilds it.
      - name: The android-port pin
        id: port
        run: echo "pin=$(grep -o '"[0-9a-f]\{40\}"' <(grep -A3 '^ANDROID_PORT' tools/check/pins.py) | tr -d '"')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/android-deps
          key: android-deps-${{ steps.port.outputs.pin }}-ndk-28.2.13676358
      - name: Build, sign and check the APK
        env:
          OPENSU_ANDROID_DEPS: ${{ github.workspace }}/build/android-deps
          OPENSU_ANDROID_KEYSTORE: ${{ secrets.OPENSU_ANDROID_KEYSTORE }}
          OPENSU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OPENSU_ANDROID_KEYSTORE_PASSWORD }}
          OPENSU_ANDROID_KEY_ALIAS: ${{ secrets.OPENSU_ANDROID_KEY_ALIAS }}
          OPENSU_ANDROID_KEY_PASSWORD: ${{ secrets.OPENSU_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$OPENSU_ANDROID_KEYSTORE" || { echo "OPENSU_ANDROID_KEYSTORE is not set"; exit 1; }
          uv run --frozen python -m tools.package.android build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: build/android/out/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [appimage, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-android
          path: out
      - name: Verify the checksum
        working-directory: out
        run: sha256sum -c ./*.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "openSU ${GITHUB_REF_NAME#v}" \
            --notes "Linux x86_64 AppImage (glibc 2.39 or newer; tested on Fedora 44 and Ubuntu 24.04). See the README's Install section for requirements. Android APK for arm64-v8a and x86_64 (Android 9 or newer). Verify with \`sha256sum -c\`, the AppImage with the signing key in packaging/appimage/signing-key.asc, the APK's certificate SHA-256 BDC838D582DDC695CDAB431D2053B636EB93A0C2E1C3F468DD002D1011E43238." \
            out/*
