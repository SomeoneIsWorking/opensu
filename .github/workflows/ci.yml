name: CI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: "The one platform to build, or all"
        type: choice
        options: [all, linux, appimage, android, windows, macos]
        default: all

permissions:
  contents: read

# One run per platform at a time; a dispatch for one platform leaves the others running.
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Fedora 44, Clang)
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
          enable-cache: false
      # The Fedora 44 image the fork's local podman build uses, booted with systemd so the tests
      # get a user manager; the fork is built natively inside it.
      - name: Xvfb for the tests' hidden windows
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth
      - name: Pinned sources, configure, build, lint, test (packaging/ci container)
        run: xvfb-run -a uv run --frozen python -m tools.check ci --build-dir "$GITHUB_WORKSPACE/build/ci"

  appimage:
    name: AppImage (Ubuntu 24.04 floor)
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'appimage'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
          enable-cache: false
      - name: Install the X server the render check draws to
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth
      - name: Build and smoke-test the AppImage
        run: xvfb-run -a uv run --frozen python -m tools.package appimage all --version "ci-${GITHUB_SHA::12}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: |
            build/appimage/out/
            build/appimage/smoke/
          retention-days: 14
          if-no-files-found: error

  android:
    name: Signed Android APK (arm64-v8a, x86_64)
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
          enable-cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >-
            platforms;android-35
            build-tools;35.0.0
            ndk;28.2.13676358
      - name: Ninja for the native builds
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Rust targets for librashader
        run: rustup target add aarch64-linux-android x86_64-linux-android
      # The android-port prefix only changes with its pin; a miss rebuilds it.
      - name: The android-port pin
        id: port
        run: echo "pin=$(grep -o '"[0-9a-f]\{40\}"' <(grep -A3 '^ANDROID_PORT' tools/check/pins.py) | tr -d '"')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/android-deps
          key: android-deps-${{ steps.port.outputs.pin }}-ndk-28.2.13676358
      - name: Build, sign and check the APK
        env:
          OPENSU_ANDROID_DEPS: ${{ github.workspace }}/build/android-deps
          OPENSU_ANDROID_KEYSTORE: ${{ secrets.OPENSU_ANDROID_KEYSTORE }}
          OPENSU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OPENSU_ANDROID_KEYSTORE_PASSWORD }}
          OPENSU_ANDROID_KEY_ALIAS: ${{ secrets.OPENSU_ANDROID_KEY_ALIAS }}
          OPENSU_ANDROID_KEY_PASSWORD: ${{ secrets.OPENSU_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$OPENSU_ANDROID_KEYSTORE" || { echo "OPENSU_ANDROID_KEYSTORE is not set"; exit 1; }
          uv run --frozen python -m tools.package.android build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: build/android/out/
          retention-days: 14
          if-no-files-found: error

  windows:
    name: Windows (clang-cl, vcpkg)
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      # The sources build and the tests compare files byte for byte as the repository holds them.
      - name: Keep the repository's line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          checksum: "6dbb02d79e419522f1c500f0adb1cddcff0cda7d59b0d66ea7f5e3b4a1b2f5f0"
          enable-cache: false
      # vcpkg's built ports, keyed by what decides them; saved even when a later step fails.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/windows-ci/vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json', 'packaging/windows/triplets/*', 'cmake/toolchains/windows-clang-cl.cmake') }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ hashFiles('vcpkg.json', 'packaging/windows/triplets/*', 'cmake/toolchains/windows-clang-cl.cmake') }}-
      - name: Pinned sources, configure, build, lint, test (lavapipe for the hidden windows)
        run: uv run --frozen python -m tools.check all --platform windows --build-dir build/windows-ci
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: build/windows-ci/vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json', 'packaging/windows/triplets/*', 'cmake/toolchains/windows-clang-cl.cmake') }}-${{ github.run_id }}
      - name: Build the installer, install it and draw a frame with the installed openSU
        run: uv run --frozen python -m tools.package windows --build-dir build/windows-ci --version "ci-$($env:GITHUB_SHA.Substring(0, 12))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            build/windows-ci/package/out/
            build/windows-ci/package/smoke/frame.png
            build/windows-ci/package/smoke/install.log
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: windows-logs
          path: |
            build/windows-ci/cmake/vcpkg-manifest-install.log
            build/windows-ci/cmake/CMakeFiles/*.log
            build/windows-ci/cmake/Testing/Temporary/LastTest.log
            build/windows-ci/package/smoke/*.log
            build/windows-ci/package/out/
            build/windows-ci/deps/vcpkg/buildtrees/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  macos:
    name: macOS (arm64, Homebrew LLVM, vcpkg)
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          checksum: "a9a8df1eedeb192f2e47e40e2faabfb387db4b850209118786d42f89dde3e0ba"
          enable-cache: false
      # Homebrew checks each bottle's SHA-256; Xcode's Clang has no std::jthread.
      - name: Homebrew's LLVM and Ninja
        run: brew install llvm@22 ninja
      # vcpkg's built ports, keyed by what decides them; saved even when a later step fails.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/macos-ci/vcpkg-cache
          key: vcpkg-macos-${{ hashFiles('vcpkg.json', 'packaging/macos/triplets/*') }}-${{ github.run_id }}
          restore-keys: vcpkg-macos-${{ hashFiles('vcpkg.json', 'packaging/macos/triplets/*') }}-
      - name: Pinned sources, configure, build, lint, test (the runner's Metal device through MoltenVK)
        run: uv run --frozen python -m tools.check all --platform macos --build-dir build/macos-ci
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: build/macos-ci/vcpkg-cache
          key: vcpkg-macos-${{ hashFiles('vcpkg.json', 'packaging/macos/triplets/*') }}-${{ github.run_id }}
      - name: Build the app, unpack it and draw a frame with it
        run: uv run --frozen python -m tools.package macos --build-dir build/macos-ci --version "ci-${GITHUB_SHA::12}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            build/macos-ci/package/out/
            build/macos-ci/package/smoke/frame.png
            build/macos-ci/package/smoke/runner.png
            build/macos-ci/package/smoke/*.log
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: macos-logs
          path: |
            build/macos-ci/cmake/CMakeFiles/*.log
            build/macos-ci/cmake/Testing/Temporary/LastTest.log
            build/macos-ci/package/smoke/
            build/macos-ci/deps/vcpkg/buildtrees/**/*.log
          retention-days: 7
          if-no-files-found: ignore
