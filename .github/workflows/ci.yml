name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Fedora 44, Clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
          enable-cache: false
      # The Fedora 44 image the fork's local podman build uses, booted with systemd so the tests
      # get a user manager; the fork is built natively inside it.
      - name: Xvfb for the tests' hidden windows
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth
      - name: Pinned sources, configure, build, lint, test (packaging/ci container)
        run: xvfb-run -a uv run --frozen python -m tools.check ci --build-dir "$GITHUB_WORKSPACE/build/ci"

  appimage:
    name: AppImage (Ubuntu 24.04 floor)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
          enable-cache: false
      - name: Install the X server the render check draws to
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth
      - name: Build and smoke-test the AppImage
        run: xvfb-run -a uv run --frozen python -m tools.appimage all --version "ci-${GITHUB_SHA::12}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: |
            build/appimage/out/
            build/appimage/smoke/
          retention-days: 14
          if-no-files-found: error
